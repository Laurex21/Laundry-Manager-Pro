name: Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run check
      - run: npm run test:pilotage-overview
      - run: npm run test:customer-risk
      - run: npm run test:decision-support
      - run: npm run test:zod-migration
      - run: npm run test:platform-admin-security
      - run: npm run test:platform-admin-saas
      - run: npm run test:security-hardening
      - run: npm run test:marketing
      - run: npm run test:acquisition
      - run: npm run test:order-references
      - run: npm run test:receipt-export
      - run: npm run test:order-integrity
      - run: npm run test:tenant-isolation
      - run: npm run test:staff-invitation-boundary
      - run: npm run test:membership-run3
      - run: npm run test:schema-guard
      - run: npm run test:automatic-maintenance
      - run: npm run test:historical-repair-protection
      - run: npm run test:saas-billing
      - run: npm run test:saas-business-launch
      - run: npm run test:saas-legacy-protection
      - run: npm run test:saas-normal-opening
      - run: npm run test:dual-role-atomic
      - run: npm run test:saas-full-journey
      - run: npm run test:saas-collection-pilot
      - run: npm run test:saas-pro-pilot
      - run: npm run test:saas-pilot
      - run: npm run test:pawapay-private-diagnostic
      - run: npm run build
